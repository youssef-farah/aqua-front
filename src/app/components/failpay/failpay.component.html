<!-- failpay.component.html -->
<div class="payment-container">
  <div class="payment-card">
    <div class="icon-wrapper error">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </div>
    
    <h1>Payment Failed</h1>
    <p class="message">We couldn't process your payment. Please check your payment details and try again.</p>
    
    <div class="button-group">
      <button class="btn btn-primary" (click)="retryPayment()">
        Try Again
      </button>
      <button class="btn btn-secondary" (click)="goToBoutique()">
        Back to Boutique
      </button>
    </div>
  </div>
</div>
<app-footer></app-footer>
