<app-navbar></app-navbar>

<div class="cart-container">
  <h2>Shopping Cart</h2>

  <div *ngIf="cart.length === 0" class="empty-cart">
    <div class="empty-icon">🛒</div>
    <p>Your cart is empty</p>
    <p class="empty-subtext">Add some products to get started</p>
  </div>

  <ng-container *ngIf="cart.length > 0">
    <div class="table-wrapper">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cart">
            <td class="product-cell">
              <div class="product-name">{{ item.name }}</div>
            </td>
            <td class="price-cell">{{ item.price.toFixed(2) }} TND</td>
            <td class="quantity-cell">
              <div class="quantity-display">{{ item.quantity }}</div>
            </td>
            <td class="subtotal-cell">
              <strong>{{ (item.price * item.quantity).toFixed(2) }} TND</strong>
            </td>
            <td class="actions-cell">
              <button class="remove-btn" (click)="removeFromCart(item.id)" title="Remove item">
                🗑️
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="cart-summary">
      <div class="total-section">
        <span class="total-label">Total:</span>
        <span class="total-amount">{{ getTotalPrice().toFixed(2) }} TND</span>
      </div>
      <button 
        class="validate-btn" 
        (click)="onCheckout()"
        [disabled]="isCheckingOut || cart.length === 0">
        {{ isCheckingOut ? 'Processing...' : 'Validate Order' }}
      </button>
    </div>
  </ng-container>
</div>
<app-footer></app-footer>
