<div class="verification-container">
  <div class="verification-card">
    <!-- Icon -->
    <div class="icon-wrapper">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mail-icon">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h1 class="title">Check Your Email</h1>

    <!-- Description -->
    <p class="description">
      We've sent a verification link to your email address. 
      Please check your inbox and click the link to verify your account.
    </p>

    <!-- Reminder Box -->
    <div class="reminder-box">
      <p class="reminder-text">
        Don't forget to check your spam folder if you don't see the email in your inbox.
      </p>
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button class="btn btn-primary" (click)="handleResend()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
        Resend Verification Email
      </button>

      <button class="btn btn-secondary" (click)="handleReturnHome()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Return to Home
      </button>
    </div>
  </div>
</div>
