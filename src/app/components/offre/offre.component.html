<div class="popup-overlay" *ngIf="isVisible" (click)="closePopup()">
  <div class="popup-container" (click)="$event.stopPropagation()">

    <button class="close-btn" (click)="closePopup()">×</button>

    <h1 class="popup-title">Nos Offres</h1>

    <div class="slideshow-container" *ngIf="offres.length > 0">

      <div class="image-wrapper">
        <img src="ventes-flash-1.jpg" class="offer-image" />
      </div>

      <div class="slide fade">
        <h2>{{ offres[currentIndex].titre }}</h2>
        <p>{{ offres[currentIndex].description }}</p>
        <h3 class="offer-price">{{ offres[currentIndex].prix }} TND</h3>

        <button class="discover-btn" (click)="goToBoutique()">
          Découvrir plus !
        </button>
      </div>

      <button class="prev-btn" (click)="previousSlide()">❮</button>
      <button class="next-btn" (click)="nextSlide()">❯</button>

      <div class="dots">
        <span 
          *ngFor="let offre of offres; let i = index"
          class="dot"
          [class.active]="i === currentIndex"
          (click)="goToSlide(i)">
        </span>
      </div>
    </div>

    <div *ngIf="offres.length === 0" class="loading">
      Loading offres...
    </div>

  </div>
</div>
