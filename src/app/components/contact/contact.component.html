<app-navbar></app-navbar>
<div class="container">
  <h1 class="title">Contact</h1>

  <div class="grid">
    <!-- Left: Form -->
    <div class="card">
      <h2>Envoyez-nous un message</h2>
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Nom complet</label>
          <input formControlName="name" type="text" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input formControlName="email" type="email" required />
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea formControlName="message" rows="6" required></textarea>
        </div>

        <button type="submit" [disabled]="loading">
          {{ loading ? 'Envoi en cours...' : 'Envoyer le message' }}
        </button>
      </form>
    </div>

    <!-- Right: Info -->
    <div class="info">
      <div class="card">
        <h2>Coordonnées</h2>
        <div class="item">
          <i class="fas fa-phone"></i>
          <div>
            <p class="label">Téléphone</p>
            <p>(+216) 70 258 859</p>
            <p>(+216) 92 664 240</p>
          </div>
        </div>

        <div class="item">
          <i class="fas fa-envelope"></i>
          <div>
            <p class="label">Email</p>
            <p>stgeplanet.tn</p>
          </div>
        </div>

        <div class="item">
          <i class="fas fa-map-marker-alt"></i>
          <div>
            <p class="label">Adresse</p>
            <p>
              Rue de Tozeur Lot N° 32<br />
              Z. I. MGHIRA III, 2082<br />
              Tunisie
            </p>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Heures d'ouverture</h3>
        <div class="hours">
          <div><span>Lundi - Vendredi</span><span>8:00 - 18:00</span></div>
          <div><span>Samedi</span><span>8:00 - 13:00</span></div>
          <div><span>Dimanche</span><span class="closed">Fermé</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
