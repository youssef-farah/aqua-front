<nav class="nav">
  <div class="container nav-inner">

    <!-- Brand -->
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <img src="mouja.png" class="logo">
<div class="brand-text">
  <span class="brand-main">Cristal Piscine</span>
  <span class="brand-sub">de Carthage</span>
</div>
    </a>

    <!-- Desktop links -->
    <div class="links desktop-only">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.to"
         class="nav-link"
         [class.has-badge]="link.to === '/boutique'">
        {{ link.label }}
        <!-- Sales Badge for Boutique -->
        <span *ngIf="link.to === '/boutique'" class="sales-badge">
          <i class="fa fa-fire"></i> SOLDES
        </span>
      </a>
    </div>

    <!-- Desktop actions -->
    <div class="actions desktop-only">
      <p><i class="fa-solid fa-phone"></i> 95 529 297
</p>

      <a routerLink="/compte" class="icon-btn">
        <i class="fa fa-user"></i>
      </a>

      <a routerLink="/panier" class="icon-btn">
        <i class="fa fa-shopping-cart"></i>
        <span *ngIf="totalItems > 0" class="badge">{{ totalItems }}</span>
      </a>
    </div>

    <!-- Mobile hamburger -->
    <button class="icon-btn mobile-only"
            (click)="toggleMenu()"
            aria-label="menu">
      <i class="fa fa-bars"></i>
    </button>
  </div>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <a *ngFor="let link of navLinks"
       [routerLink]="link.to"
       (click)="closeMenu()"
       [class.has-badge-mobile]="link.to === '/boutique'">
      {{ link.label }}
      <!-- Sales Badge for Mobile Boutique -->
      <span *ngIf="link.to === '/boutique'" class="sales-badge-mobile">
        <i class="fa fa-fire"></i> SOLDES
      </span>
    </a>

    <div class="mobile-actions">
      <a routerLink="/compte" (click)="closeMenu()">Mon compte</a>
      <a routerLink="/panier" (click)="closeMenu()">Panier</a>
      <span class="phone"><i class="fa fa-phone"></i> 92664240</span>
    </div>
  </div>
</nav>
